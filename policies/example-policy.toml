version = 1

[environments.production]
may_receive_from = ["production"]

[environments.staging]
may_receive_from = ["staging", "production"]

[services.postgres]
public = false

[services.redis]
public = false

[ssh]
public = false

[required_controls.production_stateful]
deletion_protection = true
backup_evidence = "required"

# Egress per server role (the `role` label): false = no direct Internet egress, or a list of allowed ports.
[roles.db]
internet_egress = false

[roles.app]
internet_egress = ["tcp/443", "udp/123"]
