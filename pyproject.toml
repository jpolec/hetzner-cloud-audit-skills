[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hetzner-audit"
version = "0.4.0"
description = "Hetzner Audit: know your Hetzner Cloud. Read-only security, cost, and architecture audit with evidence-backed recommended actions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jakub Połeć"}]
keywords = ["hetzner", "hetzner-cloud", "cloud-security", "attack-path", "network-map", "finops", "devsecops", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
hetzner-audit = "hetzner_security.cli.main:main"
hetzner-sec = "hetzner_security.cli.main:main"

[project.urls]
Homepage = "https://github.com/jpolec/hetzner-cloud-audit-skills"
Issues = "https://github.com/jpolec/hetzner-cloud-audit-skills/issues"
Changelog = "https://github.com/jpolec/hetzner-cloud-audit-skills/blob/main/CHANGELOG.md"
Maintainer = "https://github.com/jpolec"
QuantJourney = "https://quantjourney.cloud"

[tool.hatch.build.targets.sdist]
# Never ship local settings, real audit output, or release helpers.
exclude = [".claude", "_output", "_gtm", "dist", "publish_pypi.sh", "reports"]

[tool.hatch.build.targets.wheel]
packages = ["src/hetzner_security"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S104", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hetzner_security"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
