name: Bug report
description: Report incorrect behavior without including private infrastructure data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste tokens, credentials, real hostnames, customer data, or sensitive topology.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

