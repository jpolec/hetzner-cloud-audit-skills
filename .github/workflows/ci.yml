name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: ./scripts/demo.sh
      - run: python scripts/validate_artifacts.py

  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build pip-audit
      # Audit the toolchain before installing our own wheel: the package has no runtime
      # dependencies, and querying PyPI for an unpublished version fails during outages.
      - run: pip-audit --vulnerability-service osv
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: hetzner-audit audit --input benchmarks/scenarios/v0.1-insecure.json --format json --output /tmp/audit.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          mode: cost
          input: benchmarks/scenarios/v0.3-cost.json
          format: markdown
          output: /tmp/cost-audit.md
      - run: grep -F 'EUR 90.00/month' /tmp/cost-audit.md
      - uses: ./
        with:
          mode: audit
          input: benchmarks/scenarios/v0.1-insecure.json
          format: sarif
          output: /tmp/audit.sarif
          fail-on: none
      - run: python3 -c "import json; json.load(open('/tmp/audit.sarif'))"
      - id: gate
        continue-on-error: true
        uses: ./
        with:
          mode: audit
          input: benchmarks/scenarios/v0.1-insecure.json
          format: markdown
          output: /tmp/audit.md
          fail-on: confirmed-high
      - name: fail-on confirmed-high must fail on the insecure fixture
        run: test "${{ steps.gate.outcome }}" = "failure"
